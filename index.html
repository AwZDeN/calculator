<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Калькулятор</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
   <div class="app">
      <aside class="history">
          <div class="history-header">
            <span class="history-title">История</span>
            <button class="history-clear" data-action="clear-history">Очистить</button>
          </div>

          <ul class="history-list">
            
          </ul>
        </aside>
      <div class="calculator">
        <div class="display">
          <div class="display-history"></div>
          <div class="display-current"></div>
        </div>

        <div class="buttons">
          <button class="btn btn-func" data-action="clear">AC</button>
          <button class="btn btn-func" data-action="delete">⌫</button>
          <button class="btn btn-op btn-func" data-op="%">%</button>
          <button class="btn btn-op" data-op="/">÷</button>

          <button class="btn btn-number" data-num="7">7</button>
          <button class="btn btn-number" data-num="8">8</button>
          <button class="btn btn-number" data-num="9">9</button>
          <button class="btn btn-op" data-op="*">×</button>

          <button class="btn btn-number" data-num="4">4</button>
          <button class="btn btn-number" data-num="5">5</button>
          <button class="btn btn-number" data-num="6">6</button>
          <button class="btn btn-op" data-op="-">−</button>

          <button class="btn btn-number" data-num="1">1</button>
          <button class="btn btn-number" data-num="2">2</button>
          <button class="btn btn-number" data-num="3">3</button>
          <button class="btn btn-op" data-op="+">+</button>

          <button class="btn btn-number btn-zero" data-num="0">0</button>
          <button class="btn btn-number decimal" data-action="decimal">.</button>
          <button class="btn btn-equal" data-action="equals">=</button>
        </div>
      </div>
  </div>
  <script src="js/index.js"></script>
</body>
</html>
